<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="monetag" content="34d2e57cb7e89924e6cb7e4e0e6cfe58">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crônicas RPG</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { background: #121212; color: #eee; font-family: system-ui, sans-serif; padding: 15px; max-width: 500px; margin: auto; }
        .card { background: #1e1e24; padding: 16px; border-radius: 12px; margin-bottom: 14px; border: 1px solid #2e2e38; }
        h2, h3 { margin: 0 0 10px 0; }
        input { width: 100%; padding: 12px; margin: 6px 0 12px 0; border-radius: 8px; border: 1px solid #444; background: #121212; color: white; font-size: 16px; user-select: text; }
        .hp-bar { background: #333; border-radius: 6px; overflow: hidden; height: 22px; margin: 8px 0; }
        .hp-fill { background: #e63946; height: 100%; transition: width 0.25s; }
        .btn { display: block; width: 100%; padding: 14px; margin: 8px 0; background: #4361ee; color: white; border-radius: 10px; font-weight: bold; border: none; font-size: 16px; }
        .btn-red { background: #d90429; }
        .btn-green { background: #2a9d8f; }
        .btn-gold { background: #e9c46a; color: #111; }
        .btn-dark { background: #333; font-size: 13px; padding: 8px; }
        .log { background: #0a0a0c; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 13px; color: #4cc9f0; min-height: 95px; border: 1px solid #222; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        let usuarioAtual = sessionStorage.getItem("rpg_user_logado");
        let j = null;
        const pegarContas = () => JSON.parse(localStorage.getItem("rpg_todas_contas")) || {};
        const salvarContas = (c) => localStorage.setItem("rpg_todas_contas", JSON.stringify(c));

        function entrarOuCriar(modo) {
            const user = document.getElementById("user").value.trim().toLowerCase();
            const pass = document.getElementById("pass").value.trim();
            if (!user || !pass) return alert("Preencha usuário e senha!");
            const contas = pegarContas();

            if (modo === "criar") {
                if (contas[user]) return alert("Usuário já existe!");
                contas[user] = {
                    senha: pass,
                    dados: {
                        nome: user, hp: 100, hp_max: 100, ataque_base: 12, defesa_base: 2,
                        arma: { nome: "Adaga Enferrujada", bonus: 3 },
                        armadura: { nome: "Roupa de Pano", bonus: 1 },
                        pocoes: 3, ouro: 30, nivel: 1,
                        log: [`Conta de ${user} criada!`], inimigo: null
                    }
                };
                salvarContas(contas);
            } else if (!contas[user] || contas[user].senha !== pass) {
                return alert("Usuário ou senha incorretos!");
            }
            usuarioAtual = user;
            sessionStorage.setItem("rpg_user_logado", user);
            carregarJogo();
        }

        function sair() {
            sessionStorage.removeItem("rpg_user_logado");
            usuarioAtual = null; j = null; render();
        }

        function carregarJogo() {
            const contas = pegarContas();
            if (usuarioAtual && contas[usuarioAtual]) j = contas[usuarioAtual].dados;
            render();
        }

        function salvar() {
            const contas = pegarContas();
            contas[usuarioAtual].dados = j;
            salvarContas(contas);
            render();
        }

        function addLog(msg) {
            j.log.push(msg);
            if (j.log.length > 5) j.log.shift();
        }

        function explorar() {
            const monstros = [
                { nome: "Goblin Saqueador", hp: 45, hp_max: 45, ataque: 11, ouro: 25 },
                { nome: "Esqueleto Guerreiro", hp: 75, hp_max: 75, ataque: 16, ouro: 45 },
                { nome: "Orc Berserker", hp: 110, hp_max: 110, ataque: 22, ouro: 75 }
            ];
            j.inimigo = { ...monstros[Math.floor(Math.random() * monstros.length)] };
            addLog(`⚠️ Um ${j.inimigo.nome} apareceu!`);
            salvar();
        }

        function atacar() {
            if (!j.inimigo) return;
            const atk = j.ataque_base + j.arma.bonus;
            const dano = Math.floor(Math.random() * 9) + (atk - 3);
            j.inimigo.hp -= dano;
            addLog(`⚔️ Causou ${dano} de dano!`);

            if (j.inimigo.hp <= 0) {
                addLog(`🎉 Derrotou ${j.inimigo.nome}! +${j.inimigo.ouro} ouro!`);
                j.ouro += j.inimigo.ouro; j.nivel++; j.ataque_base += 2; j.defesa_base++; j.hp_max += 15;
                j.inimigo = null;
            } else {
                const def = j.defesa_base + j.armadura.bonus;
                const danoIni = Math.max(1, (Math.floor(Math.random() * 7) + (j.inimigo.ataque - 3)) - def);
                j.hp -= danoIni;
                addLog(`💥 ${j.inimigo.nome} causou ${danoIni} de dano!`);
                if (j.hp <= 0) {
                    j.hp = j.hp_max; j.ouro = Math.floor(j.ouro / 2); j.inimigo = null;
                    addLog("💀 Desmaiou e perdeu metade do ouro!");
                }
            }
            salvar();
        }
        function usarPocao() {
            if (j.pocoes > 0) { j.pocoes--; j.hp = Math.min(j.hp_max, j.hp + 50); addLog("🧪 +50 HP!"); }
            else addLog("❌ Sem poções!");
            salvar();
        }
        function fugir() { j.inimigo = null; addLog("🏃 Fugiu."); salvar(); }
        function taverna() {
            if (j.ouro >= 15) { j.ouro -= 15; j.hp = j.hp_max; addLog("🛏️ Vida cheia!"); }
            else addLog("❌ Precisa de 15 ouro!");
            salvar();
        }
        function comprarPocao() {
            if (j.ouro >= 20) { j.ouro -= 20; j.pocoes++; addLog("🧪 +1 Poção!"); }
            else addLog("❌ Precisa de 20 ouro!");
            salvar();
        }
        function melhorarArma() {
            if (j.ouro >= 50) { j.ouro -= 50; j.arma.bonus += 5; j.arma.nome = `Espada +${j.arma.bonus}`; addLog("⚒️ Arma +5!"); }
            else addLog("❌ Precisa de 50 ouro!");
            salvar();
        }
        function melhorarArmadura() {
            if (j.ouro >= 50) { j.ouro -= 50; j.armadura.bonus += 4; j.armadura.nome = `Armadura +${j.armadura.bonus}`; addLog("🛡️ Armadura +4!"); }
            else addLog("❌ Precisa de 50 ouro!");
            salvar();
        }

        function render() {
            if (!usuarioAtual || !j) {
                document.getElementById("app").innerHTML = `
                    <div class="card">
                        <h2>⚔️ Crônicas RPG</h2>
                        <input type="text" id="user" placeholder="Usuário">
                        <input type="password" id="pass" placeholder="Senha">
                        <button class="btn btn-green" onclick="entrarOuCriar('entrar')">Entrar</button>
                        <button class="btn" onclick="entrarOuCriar('criar')">Criar Conta</button>
                    </div>`;
                return;
            }
            const pctHeroi = Math.max(0, (j.hp / j.hp_max) * 100);
            let tela = j.inimigo ? `
                <div class="card" style="border-color: #e63946;">
                    <h3>👹 ${j.inimigo.nome}</h3>
                    <div>❤️ HP: ${j.inimigo.hp}/${j.inimigo.hp_max}</div>
                    <div class="hp-bar"><div class="hp-fill" style="width: ${(j.inimigo.hp / j.inimigo.hp_max) * 100}%;"></div></div>
                    <button class="btn btn-red" onclick="atacar()">⚔️ Atacar</button>
                    <div class="grid">
                        <button class="btn btn-green" onclick="usarPocao()">🧪 Poção (${j.pocoes})</button>
                        <button class="btn" onclick="fugir()">🏃 Fugir</button>
                    </div>
                </div>` : `
                <div class="card">
                    <button class="btn btn-red" onclick="explorar()">🗺️ Explorar Masmorra</button>
                    <div class="grid">
                        <button class="btn btn-green" onclick="taverna()">🛏️ Curar (15💰)</button>
                        <button class="btn btn-gold" onclick="comprarPocao()">🧪 Poção (20💰)</button>
                        <button class="btn" onclick="melhorarArma()">⚔️ +Arma (50💰)</button>
                        <button class="btn" onclick="melhorarArmadura()">🛡️ +Armadura (50💰)</button>
                    </div>
                </div>`;

            document.getElementById("app").innerHTML = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h2>🧙 ${j.nome} • Nv.${j.nivel}</h2>
                        <button class="btn btn-dark" style="width:auto;" onclick="sair()">Sair</button>
                    </div>
                    <div>❤️ HP: ${j.hp}/${j.hp_max}</div>
                    <div class="hp-bar"><div class="hp-fill" style="width: ${pctHeroi}%;"></div></div>
                    <div style="font-size:14px;">⚔️ Atk: ${j.ataque_base + j.arma.bonus} | 🛡️ Def: ${j.defesa_base + j.armadura.bonus} | 💰 ${j.ouro} | 🧪 ${j.pocoes}</div>
                </div>
                ${tela}
                <div class="log">${j.log.map(l => `<div>> ${l}</div>`).join("")}</div>`;
        }
        if (usuarioAtual) carregarJogo(); else render();
    </script>
</body>
</html>
